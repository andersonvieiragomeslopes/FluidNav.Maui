name: Build, Pack and Publish (GitHub Packages)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore src/FluidNav.csproj

      - name: Restore dependencies
        run: dotnet restore src/FluidNav.csproj -p:TargetFramework=net10.0-android

      - name: Build
        run: dotnet build src/FluidNav.csproj -c Release -p:TargetFrameworks=net10.0-android --no-restore

      - name: Pack (local package)
        run: dotnet pack src/FluidNav.csproj -c Release -p:TargetFrameworks=net10.0-android --no-build -o artifacts/nuget

      - name: Publish package to GitHub Packages
        if: github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No NuGet packages found to publish."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
          done

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-nuget-package
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
