name: Build and Pack (local NuGet)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore src/FluidNav.csproj

      - name: Restore dependencies
        run: dotnet restore src/FluidNav.csproj -p:TargetFramework=net10.0-android

      - name: Build
        run: dotnet build src/FluidNav.csproj -c Release -p:TargetFrameworks=net10.0-android --no-restore

      - name: Pack (local package)
        run: dotnet pack src/FluidNav.csproj -c Release -p:TargetFrameworks=net10.0-android --no-build -o artifacts/nuget

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-nuget-package
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
